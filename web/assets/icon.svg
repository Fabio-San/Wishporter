<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-label="Wishporter icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#122033"/>
      <stop offset="1" stop-color="#1B2E49"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.42" cy="0.38" r="0.68">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#2DD4BF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.35" stop-color="#F8D06A"/>
      <stop offset="0.75" stop-color="#F0B13C"/>
      <stop offset="1" stop-color="#D98A22"/>
    </linearGradient>

    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0.55">
      <stop offset="0" stop-color="#7DF3E1"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>

    <filter id="glowGold" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowTeal" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#halo)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <!-- Comet trail: wishes travelling around the star and into the portal -->
  <path d="M 132 390 C 88 280 128 118 250 88 C 366 60 444 148 438 262 C 434 332 410 372 374 400"
        fill="none" stroke="#060D18" stroke-width="36" stroke-linecap="round" opacity="0.6"/>
  <path d="M 132 390 C 88 280 128 118 250 88 C 366 60 444 148 438 262 C 434 332 410 372 374 400"
        fill="none" stroke="url(#teal)" stroke-width="17" stroke-linecap="round" filter="url(#glowTeal)"/>

  <!-- Destination portal -->
  <circle cx="374" cy="406" r="33" fill="#0A1524" stroke="url(#teal)" stroke-width="11"/>
  <circle cx="374" cy="406" r="33" fill="none" stroke="#7DF3E1" stroke-opacity="0.3" stroke-width="21"/>
  <circle cx="374" cy="406" r="11" fill="#F472B6"/>

  <!-- Wishing star -->
  <path d="M 228 110 C 238 170 258 190 316 200 C 258 210 238 230 228 290 C 218 230 198 210 140 200 C 198 190 218 170 228 110 Z"
        fill="url(#gold)" filter="url(#glowGold)"/>

  <!-- Primogem-like diamond accent inside the star -->
  <polygon points="228,185 243,200 228,215 213,200" fill="#2DD4BF" opacity="0.9"/>
  <polygon points="228,188 240,200 228,212 216,200" fill="#FFFFFF" opacity="0.25"/>

  <!-- Sparkles -->
  <path d="M 116 144 C 118 154 121 157 131 159 C 121 161 118 164 116 174 C 114 164 111 161 101 159 C 111 157 114 154 116 144 Z"
        fill="#7DF3E1" opacity="0.85"/>
  <path d="M 410 112 C 412 120 414 122 422 124 C 414 126 412 128 410 136 C 408 128 406 126 398 124 C 406 122 408 120 410 112 Z"
        fill="#F8D06A" opacity="0.9"/>
  <path d="M 300 356 C 302 364 304 366 312 368 C 304 370 302 372 300 380 C 298 372 296 370 288 368 C 296 366 298 364 300 356 Z"
        fill="#F472B6" opacity="0.85"/>
  <circle cx="150" cy="330" r="4" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="392" cy="314" r="3" fill="#7DF3E1" opacity="0.7"/>
</svg>
