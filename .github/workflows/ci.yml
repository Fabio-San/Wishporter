name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q convert.py run.py i18n.py version.py tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

  launcher:
    name: Launcher syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check run.sh syntax
        run: bash -n run.sh

  package:
    name: Build release ZIP
    runs-on: ubuntu-latest
    needs: [test, launcher]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build ZIP
        run: python scripts/package.py
      - uses: actions/upload-artifact@v5
        with:
          name: wishporter-zip
          path: dist/*.zip
